# Documentación OpenAPI de ShipNow API. Se carga desde src/docs/swagger.config.js
# Schemas reutilizables y esquema de seguridad.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: currentUser
      description: JWT en cookie httpOnly. Se obtiene con POST /api/sessions/login (desde esta misma página la cookie
        se guarda sola).
  schemas:
    UserRole:
      type: string
      enum:
      - admin
      - user
      - driver
      description: admin = administrador, user = cliente, driver = repartidor
    ProductStatus:
      type: string
      enum:
      - available
      - out_of_stock
      description: Se calcula solo según el stock (stock > 0 → available)
    OrderStatus:
      type: string
      enum:
      - created
      - assigned
      - picked_up
      - in_transit
      - delivered
      - cancelled
    DeliveryStatus:
      type: string
      enum:
      - assigned
      - picked_up
      - in_transit
      - delivered
      description: Una entrega solo avanza en este orden, un paso por vez
    DeliveryPriority:
      type: string
      enum:
      - low
      - normal
      - high
      - urgent
    User:
      type: object
      properties:
        id:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        first_name:
          type: string
          example: Ana
        last_name:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: ana.perez@test.com
        role:
          $ref: '#/components/schemas/UserRole'
    CurrentUser:
      type: object
      description: Datos que viajan en el JWT de la sesión
      properties:
        id:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        email:
          type: string
          format: email
          example: ana.perez@test.com
        role:
          $ref: '#/components/schemas/UserRole'
    Product:
      type: object
      properties:
        id:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        name:
          type: string
          example: Caja chica 20x20
        description:
          type: string
          example: Caja de cartón para envíos chicos
        category:
          type: string
          example: embalaje
        price:
          type: number
          example: 450
        stock:
          type: integer
          example: 120
        status:
          $ref: '#/components/schemas/ProductStatus'
    OrderItem:
      type: object
      required:
      - name
      - quantity
      - price
      properties:
        name:
          type: string
          example: Caja chica 20x20
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          minimum: 0
          example: 450
    Order:
      type: object
      properties:
        id:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        customer:
          type: string
          description: Id del usuario (cliente) dueño del pedido
          example: 665f1c2e8f1b2a0012a4b3c1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          type: string
          example: Av. Maipú 1234, Olivos
        total:
          type: number
          description: Suma de quantity × price de los items
          example: 900
        status:
          $ref: '#/components/schemas/OrderStatus'
        priority:
          $ref: '#/components/schemas/DeliveryPriority'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-18T20:15:00.000Z'
        proofs:
          type: array
          description: Comprobantes de entrega subidos (solo metadatos)
          items:
            $ref: '#/components/schemas/FileMetadata'
    DocumentType:
      type: string
      enum:
      - user_document
      - driver_license
      - delivery_proof
      description: user_document = documento de usuario (carpeta documents), driver_license = licencia de repartidor
        (carpeta licenses), delivery_proof = comprobante de entrega (carpeta proofs)
    FileMetadata:
      type: object
      description: 'Metadatos de un archivo subido. En la base se guarda solo esto: el archivo vive en la carpeta
        uploads/ del servidor.'
      properties:
        originalName:
          type: string
          description: Nombre con el que lo subió el cliente
          example: dni.pdf
        fileName:
          type: string
          description: Nombre generado por el servidor
          example: 1790000000000-8f73c9b2-a1d4-4c5e-9b1a-0f3d2c1b4a5e.pdf
        path:
          type: string
          description: Ruta relativa donde quedó guardado
          example: uploads/documents/1790000000000-8f73c9b2-a1d4-4c5e-9b1a-0f3d2c1b4a5e.pdf
        mimeType:
          type: string
          enum:
          - application/pdf
          - image/jpeg
          - image/png
          example: application/pdf
        size:
          type: integer
          description: Tamaño en bytes
          example: 24533
        type:
          $ref: '#/components/schemas/DocumentType'
        uploadedAt:
          type: string
          format: date-time
          example: '2026-11-18T20:15:00.000Z'
    UserDocuments:
      type: object
      properties:
        id:
          type: string
          description: Id del usuario
          example: 665f1c2e8f1b2a0012a4b3c1
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FileMetadata'
    UserDocumentsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Documento cargado correctamente
          description: Solo al subir un documento
        payload:
          $ref: '#/components/schemas/UserDocuments'
    Delivery:
      type: object
      properties:
        id:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        order:
          type: string
          description: Id del pedido asociado
          example: 665f1c2e8f1b2a0012a4b3c1
        driver:
          type: string
          description: Id del usuario con rol driver asignado
          example: 665f1c2e8f1b2a0012a4b3c1
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        priority:
          $ref: '#/components/schemas/DeliveryPriority'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-18T20:15:00.000Z'
    MockUser:
      type: object
      description: Usuario simulado (no se guarda, por eso no tiene id)
      properties:
        first_name:
          type: string
          example: Ana
        last_name:
          type: string
          example: Pérez
        email:
          type: string
          example: ana.perez.k3x9@test.com
        role:
          type: string
          enum:
          - user
          - driver
        isAvailable:
          type: boolean
          description: Solo en repartidores
          example: true
    MockOrder:
      type: object
      description: Pedido simulado (el cliente es un id inventado)
      properties:
        customer:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          type: string
          example: Calle Falsa 123
        total:
          type: number
          example: 900
        status:
          $ref: '#/components/schemas/OrderStatus'
        priority:
          $ref: '#/components/schemas/DeliveryPriority'
    MockDelivery:
      type: object
      description: Entrega simulada (pedido y repartidor son ids inventados)
      properties:
        order:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        driver:
          type: string
          description: ObjectId de MongoDB
          example: 665f1c2e8f1b2a0012a4b3c1
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        priority:
          $ref: '#/components/schemas/DeliveryPriority'
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operación realizada correctamente
    ErrorResponse:
      type: object
      description: Estructura única de todos los errores de la API
      required:
      - status
      - error
      - message
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Código estable del diccionario de errores
          enum:
          - DATABASE_ERROR
          - DELIVERY_NOT_FOUND
          - DUPLICATE_KEY
          - EMAIL_EXISTS
          - FILE_REQUIRED
          - FILE_TOO_LARGE
          - FORBIDDEN
          - INTERNAL_SERVER_ERROR
          - INVALID_CREDENTIALS
          - INVALID_DELIVERY_STATUS
          - INVALID_DOCUMENT_TYPE
          - INVALID_DRIVER
          - INVALID_EMAIL
          - INVALID_FILE_FIELD
          - INVALID_FILE_TYPE
          - INVALID_JSON
          - INVALID_MOCK_AMOUNT
          - INVALID_MOCK_ROLE
          - INVALID_ORDER_ITEMS
          - INVALID_ORDER_STATUS
          - INVALID_PASSWORD
          - INVALID_PRICE
          - INVALID_PRIORITY
          - INVALID_PRODUCT_STATUS
          - INVALID_ROLE
          - INVALID_SORT
          - INVALID_STOCK
          - MISSING_FIELDS
          - MOCK_GENERATION_ERROR
          - MOCK_NO_CUSTOMERS
          - MOCK_NO_DRIVERS
          - ORDER_NOT_FOUND
          - PAYLOAD_TOO_LARGE
          - PRODUCT_EXISTS
          - PRODUCT_NOT_FOUND
          - ROUTE_NOT_FOUND
          - UNAUTHORIZED
          - UPLOAD_ERROR
          - USER_NOT_FOUND
          - VALIDATION_ERROR
          example: USER_NOT_FOUND
        message:
          type: string
          example: El usuario no existe
        details:
          type: string
          description: 'Solo fuera de producción: información extra para debugging'
    UserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: '#/components/schemas/User'
    CurrentUserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: '#/components/schemas/CurrentUser'
    ProductResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: '#/components/schemas/Product'
    ProductListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
    OrderResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: '#/components/schemas/Order'
    OrderUploadResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Comprobante cargado correctamente
        payload:
          $ref: '#/components/schemas/Order'
    OrderListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
    DeliveryResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: '#/components/schemas/Delivery'
    DeliveryListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
    UserPageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
    HealthResponse:
      type: object
      description: Estado de la API. No expone información sensible (nada de URI de base de datos, secretos ni versiones).
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          description: ok = todo bien; degraded = la API no puede atender (por ejemplo, sin conexión a la base de
            datos)
          example: ok
        environment:
          type: string
          enum:
          - development
          - production
          - test
          example: production
        uptime:
          type: integer
          description: Segundos desde que arrancó el proceso
          example: 3600
        timestamp:
          type: string
          format: date-time
          example: '2026-11-18T20:15:00.000Z'
          description: Fecha y hora actual del servidor
        database:
          type: string
          enum:
          - connected
          - disconnected
          example: connected
