# Documentación OpenAPI de ShipNow API. Se carga desde src/docs/swagger.config.js
paths:
  /api/loggerTest:
    get:
      tags:
      - Logger
      summary: Probar los niveles del logger
      description: '**Herramienta interna de validación, no es una funcionalidad de negocio.** Genera un log de
        cada nivel (debug, http, info, warning, error y fatal) para comprobar que el logger funciona: en consola
        aparecen según el entorno y en `logs/error-AAAA-MM-DD.log` quedan solo `error` y `fatal`.


        **Herramienta de desarrollo: no está disponible en producción** (`NODE_ENV=production`): allí responde `404
        ROUTE_NOT_FOUND`, porque genera logs de error y no tiene sentido en un servidor real.'
      responses:
        '200':
          description: Logs generados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logs generados correctamente
                  levels:
                    type: array
                    items:
                      type: string
                    example:
                    - debug
                    - http
                    - info
                    - warning
                    - error
                    - fatal
        '500':
          description: 'Error interno: INTERNAL_SERVER_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_SERVER_ERROR:
                  summary: INTERNAL_SERVER_ERROR
                  value:
                    status: error
                    error: INTERNAL_SERVER_ERROR
                    message: Error interno del servidor
