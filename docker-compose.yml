# OPCIONAL: levanta la API junto con una base MongoDB local, para probar sin necesitar Atlas.
#
#   1) cp .env.production.example .env.production   (y completar JWT_SECRET)
#   2) docker compose up --build
#
# La API queda en http://localhost:8080 (health: /api/health, Swagger: /api/docs).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      # Usa la base del servicio "mongo" de este compose (pisa el MONGODB_URI del archivo .env.production)
      MONGODB_URI: mongodb://mongo:27017/shipnow
    volumes:
      # Los archivos subidos y los logs viven en volúmenes: el sistema de archivos del contenedor es descartable
      - uploads_data:/app/uploads
      - logs_data:/app/logs

volumes:
  mongo_data:
  uploads_data:
  logs_data:
